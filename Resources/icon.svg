<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS icon grid: 824×824 tile centred on a 1024 canvas, corner radius ~185. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27b3a8"/>
      <stop offset="1" stop-color="#0b5753"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff5f2"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#04302d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Waveform: nine bars shaped like a spoken phrase, centred on y = 540. -->
  <g fill="url(#bar)" filter="url(#soft)">
    <rect x="236" y="485" width="48" height="110" rx="24"/>
    <rect x="300" y="430" width="48" height="220" rx="24"/>
    <rect x="364" y="350" width="48" height="380" rx="24"/>
    <rect x="428" y="300" width="48" height="480" rx="24"/>
    <rect x="492" y="390" width="48" height="300" rx="24"/>
    <rect x="556" y="335" width="48" height="410" rx="24"/>
    <rect x="620" y="420" width="48" height="240" rx="24"/>
    <rect x="684" y="465" width="48" height="150" rx="24"/>
    <rect x="748" y="500" width="48" height="80" rx="24"/>
  </g>

  <!-- Recording dot. -->
  <circle cx="752" cy="292" r="58" fill="#ffffff" opacity="0.95"/>
  <circle cx="752" cy="292" r="44" fill="#ef3b44"/>
</svg>
